syntax = "proto3";

package weather;

option java_multiple_files = true;
option java_package = "weather.grpc";

service ChangeDetectorService {
  rpc SendGlobalMean(GlobalMeanRequest) returns (GlobalMeanResponse);
  rpc SendGlobalSigma(GlobalSigmaRequest) returns (GlobalSigmaResponse);
  rpc SendWeatherData(stream WeatherDataRequest) returns (WeatherDataResponse);
}

service ReceiverService {
  rpc SendWeatherData(stream WeatherDataRequest) returns (WeatherDataResponse);
}

message GlobalSigmaRequest {
  double globalSigma = 1;
}

message GlobalMeanRequest {
  double globalMean = 1;
}

message GlobalSigmaResponse {
  bool received = 1;
}

message GlobalMeanResponse {
  bool received = 1;
}

message WeatherDataRequest {
  int64 timestamp = 1;
  double temperature = 2;
}

message WeatherDataResponse {
  bool received = 1;
}